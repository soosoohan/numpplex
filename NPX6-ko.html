<script>
// 게임 설정
const getMaxRounds = () => {
  return window.innerWidth < 768 ? 6 : 10;
};

// 게임 상태
let currentRound = 1;
let maxRounds = getMaxRounds();
let currentPlayer = 1; // 1 또는 2
let userTotalScore = 0;
let computerTotalScore = 0;
let userRoundScores = [];
let computerRoundScores = [];
let userExpression = [];
let computerExpression = [];
let userCards = [];
let computerCards = [];
let usedCardIndices = [];
let computerUsedCardIndices = [];
let gameEnded = false;
let player1Submitted = false;
let player2Submitted = false;
let player1Score = 0;
let player2Score = 0;

// 카드덱 생성
const createNumberDeck = () => {
  const deck = [];
  for (let num = 1; num <= 10; num++) {
    for (let i = 0; i < 2; i++) deck.push(num);
  }
  for (let num = 11; num <= 20; num++) {
    deck.push(num);
  }
  return deck;
};

const createOperatorDeck = () => {
  const deck = [];
  for (let i = 0; i < 5; i++) deck.push('+');
  for (let i = 0; i < 5; i++) deck.push('-');
  for (let i = 0; i < 5; i++) deck.push('×');
  for (let i = 0; i < 5; i++) deck.push('÷');
  return deck;
};

const shuffleAndDraw = (deck, count) => {
  const shuffled = [...deck].sort(() => 0.5 - Math.random());
  return shuffled.slice(0, count);
};

const generateCards = () => {
  const numbers = shuffleAndDraw(createNumberDeck(), 3);
  const operators = shuffleAndDraw(createOperatorDeck(), 2);
  return [...numbers, ...operators];
};

// 결과 처리
const processResult = (value) => {
  return Math.round(value);
};

// 턴 전환
const switchPlayer = () => {
  currentPlayer = currentPlayer === 1 ? 2 : 1;
  updatePlayerDisplay();
};

const updatePlayerDisplay = () => {
  const player1Area = document.getElementById('player1Area');
  const player2Area = document.getElementById('player2Area');
  const turnDisplay = document.getElementById('currentTurnDisplay');

  if (currentPlayer === 1) {
    player1Area.classList.remove('player-inactive');
    player1Area.classList.add('current-player');
    player2Area.classList.add('player-inactive');
    player2Area.classList.remove('current-player');
    turnDisplay.textContent = '🎯 플레이어1의 차례입니다';
    turnDisplay.className = 'text-lg font-bold mt-2 text-blue-600';
    
    // 버튼 활성화/비활성화
    document.getElementById('submitBtn1').disabled = false;
    document.querySelector('#player1Buttons .cloud-btn:last-child').disabled = false;
    document.getElementById('submitBtn2').disabled = true;
    document.querySelector('#player2Buttons .cloud-btn:last-child').disabled = true;
  } else {
    player2Area.classList.remove('player-inactive');
    player2Area.classList.add('current-player');
    player1Area.classList.add('player-inactive');
    player1Area.classList.remove('current-player');
    turnDisplay.textContent = '🎯 플레이어2의 차례입니다';
    turnDisplay.className = 'text-lg font-bold mt-2 text-red-600';
    
    // 버튼 활성화/비활성화
    document.getElementById('submitBtn2').disabled = false;
    document.querySelector('#player2Buttons .cloud-btn:last-child').disabled = false;
    document.getElementById('submitBtn1').disabled = true;
    document.querySelector('#player1Buttons .cloud-btn:last-child').disabled = true;
  }
};

// 점수판 업데이트
const updateScoreboard = () => {
  for (let i = 1; i <= 10; i++) {
    const userCell = document.getElementById(`userR${i}`);
    const compCell = document.getElementById(`compR${i}`);
    if (userCell) userCell.classList.remove('current-round');
    if (compCell) compCell.classList.remove('current-round');
  }

  for (let i = 0; i < userRoundScores.length; i++) {
    const userCell = document.getElementById(`userR${i + 1}`);
    if (userCell) userCell.textContent = userRoundScores[i];
  }
  for (let i = 0; i < computerRoundScores.length; i++) {
    const compCell = document.getElementById(`compR${i + 1}`);
    if (compCell) compCell.textContent = computerRoundScores[i];
  }
  
  document.getElementById('userTotal').textContent = userTotalScore;
  document.getElementById('compTotal').textContent = computerTotalScore;

  if (currentRound <= maxRounds) {
    const userCell = document.getElementById(`userR${currentRound}`);
    const compCell = document.getElementById(`compR${currentRound}`);
    if (userCell) userCell.classList.add('current-round');
    if (compCell) compCell.classList.add('current-round');
  }
};

// 카드 렌더링
const renderCards = () => {
  const cardsArea = document.getElementById('cardsArea');
  cardsArea.innerHTML = '';
  
  userCards.forEach((card, index) => {
    const btn = document.createElement('button');
    btn.className = `${!isNaN(card) ? 'number-card' : 'operator-card'} ${usedCardIndices.includes(index) ? 'used' : ''}`;
    btn.textContent = card;
    btn.onclick = () => {
      if (currentPlayer === 1 && !player1Submitted && !usedCardIndices.includes(index)) {
        userExpression.push(card);
        usedCardIndices.push(index);
        updateUserExpression();
        renderCards();
        
        if (usedCardIndices.length === 5) {
          document.getElementById('submitBtn1').style.background = 'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)';
        }
      }
    };
    cardsArea.appendChild(btn);
  });
};

const renderComputerCards = () => {
  const area = document.getElementById('computerCardsArea');
  area.innerHTML = '';
  
  computerCards.forEach((card, index) => {
    const btn = document.createElement('button');
    btn.className = `${!isNaN(card) ? 'number-card' : 'operator-card'} ${computerUsedCardIndices.includes(index) ? 'used' : ''}`;
    btn.textContent = card;
    btn.onclick = () => {
      if (currentPlayer === 2 && !player2Submitted && !computerUsedCardIndices.includes(index)) {
        computerExpression.push(card);
        computerUsedCardIndices.push(index);
        updateComputerExpression();
        renderComputerCards();
        
        if (computerUsedCardIndices.length === 5) {
          document.getElementById('submitBtn2').style.background = 'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)';
        }
      }
    };
    area.appendChild(btn);
  });
};

const updateUserExpression = () => {
  const display = document.getElementById('userExpression');
  if (userExpression.length === 0) {
    display.textContent = '(카드를 순서대로 클릭하세요)';
  } else {
    display.textContent = userExpression.join(' ');
  }
};

const updateComputerExpression = () => {
  const display = document.getElementById('computerExpression');
  if (computerExpression.length === 0) {
    display.textContent = '(카드를 순서대로 클릭하세요)';
  } else {
    display.textContent = computerExpression.join(' ');
  }
};

// 게임 시작
const startGame = () => {
  maxRounds = getMaxRounds();
  currentRound = 1;
  currentPlayer = 1;
  userTotalScore = 0;
  computerTotalScore = 0;
  userRoundScores = [];
  computerRoundScores = [];
  userExpression = [];
  computerExpression = [];
  usedCardIndices = [];
  computerUsedCardIndices = [];
  gameEnded = false;
  player1Submitted = false;
  player2Submitted = false;
  player1Score = 0;
  player2Score = 0;

  document.getElementById('maxRoundsDisplay').textContent = maxRounds;
  document.getElementById('maxRoundsInTitle').textContent = maxRounds;

  // 점수판 초기화
  for (let i = 1; i <= 10; i++) {
    const userCell = document.getElementById(`userR${i}`);
    const compCell = document.getElementById(`compR${i}`);
    if (userCell) {
      userCell.textContent = '-';
      userCell.classList.remove('current-round');
    }
    if (compCell) {
      compCell.textContent = '-';
      compCell.classList.remove('current-round');
    }
  }
  document.getElementById('userTotal').textContent = '0';
  document.getElementById('compTotal').textContent = '0';
  document.getElementById('roundDisplay').textContent = '1';

  userCards = generateCards();
  computerCards = generateCards();
  
  updatePlayerDisplay();
  updateScoreboard();
  renderCards();
  renderComputerCards();
  updateUserExpression();
  updateComputerExpression();
  
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('nextRoundArea').classList.add('hidden');
  
  // 버튼 색상 초기화
  document.getElementById('submitBtn1').style.background = '';
  document.getElementById('submitBtn2').style.background = '';
};

const restartGame = () => startGame();

// 수식 제출 - 수정된 버전
const submitExpression = (player) => {
  if (gameEnded) return;
  
  if (player === 1) {
    if (usedCardIndices.length !== 5) {
      return alert('모든 카드(5장)를 사용해야 합니다!');
    }
    
    try {
      const exprString = userExpression.join(' ');
      const calcExpr = exprString.replace(/×/g, '*').replace(/÷/g, '/');
      const rawUserVal = eval(calcExpr);
      player1Score = processResult(rawUserVal);
      
      document.getElementById('userExpression').textContent = `${exprString} = ${player1Score}`;
      player1Submitted = true;
      
      if (player2Submitted) {
        completeRound();
      } else {
        switchPlayer();
        document.getElementById('computerExpression').textContent = '(카드를 순서대로 클릭하세요)';
      }
      
    } catch (error) {
      alert('올바른 수식을 입력해주세요!');
    }
  } else {
    if (computerUsedCardIndices.length !== 5) {
      return alert('모든 카드(5장)를 사용해야 합니다!');
    }
    
    try {
      const exprString = computerExpression.join(' ');
      const calcExpr = exprString.replace(/×/g, '*').replace(/÷/g, '/');
      const rawComputerVal = eval(calcExpr);
      player2Score = processResult(rawComputerVal);
      
      document.getElementById('computerExpression').textContent = `${exprString} = ${player2Score}`;
      player2Submitted = true;
      
      if (player1Submitted) {
        completeRound();
      } else {
        switchPlayer();
      }
      
    } catch (error) {
      alert('올바른 수식을 입력해주세요!');
    }
  }
};

// 라운드 완료 - 수정된 버전
const completeRound = () => {
  // 점수 추가 (한 번만)
  userRoundScores.push(player1Score);
  computerRoundScores.push(player2Score);
  userTotalScore += player1Score;
  computerTotalScore += player2Score;
  
  updateScoreboard();
  
  // 모든 플레이어 영역 비활성화
  document.getElementById('player1Area').classList.add('player-inactive');
  document.getElementById('player2Area').classList.add('player-inactive');
  document.getElementById('player1Area').classList.remove('current-player');
  document.getElementById('player2Area').classList.remove('current-player');
  document.getElementById('currentTurnDisplay').textContent = '라운드 완료!';
  document.getElementById('currentTurnDisplay').className = 'text-lg font-bold mt-2 text-green-600';

  if (currentRound >= maxRounds) {
    setTimeout(() => {
      gameEnded = true;
      let resultText = '';
      
      if (userTotalScore > computerTotalScore) {
        resultText = `🏆 플레이어1 승리!<br>최종 점수: ${userTotalScore} vs ${computerTotalScore}`;
      } else if (computerTotalScore > userTotalScore) {
        resultText = `🏆 플레이어2 승리!<br>최종 점수: ${userTotalScore} vs ${computerTotalScore}`;
      } else {
        resultText = `🤝 무승부입니다!<br>최종 점수: ${userTotalScore} vs ${computerTotalScore}`;
      }
      
      document.getElementById('finalResult').innerHTML = resultText;
      document.getElementById('resultArea').classList.remove('hidden');
    }, 2000);
  } else {
    document.getElementById('nextRoundArea').classList.remove('hidden');
  }
};

// 다음 라운드
const nextRound = () => {
  if (gameEnded) return;
  
  currentRound++;
  currentPlayer = 1;
  document.getElementById('roundDisplay').textContent = currentRound;

  userCards = generateCards();
  computerCards = generateCards();
  userExpression = [];
  computerExpression = [];
  usedCardIndices = [];
  computerUsedCardIndices = [];
  player1Submitted = false;
  player2Submitted = false;
  player1Score = 0;
  player2Score = 0;

  updatePlayerDisplay();
  renderCards();
  renderComputerCards();
  updateUserExpression();
  updateComputerExpression();
  
  updateScoreboard();
  document.getElementById('nextRoundArea').classList.add('hidden');
  
  // 버튼 색상 초기화
  document.getElementById('submitBtn1').style.background = '';
  document.getElementById('submitBtn2').style.background = '';
};

// 수식 초기화
const resetExpression = (player) => {
  if (player === 1 && !player1Submitted && currentPlayer === 1) {
    userExpression = [];
    usedCardIndices = [];
    renderCards();
    updateUserExpression();
    document.getElementById('submitBtn1').style.background = '';
  } else if (player === 2 && !player2Submitted && currentPlayer === 2) {
    computerExpression = [];
    computerUsedCardIndices = [];
    renderComputerCards();
    updateComputerExpression();
    document.getElementById('submitBtn2').style.background = '';
  }
};

// 리사이즈 이벤트 리스너
window.addEventListener('resize', () => {
  const newMaxRounds = getMaxRounds();
  if (newMaxRounds !== maxRounds && !gameEnded) {
    maxRounds = newMaxRounds;
    document.getElementById('maxRoundsDisplay').textContent = maxRounds;
    document.getElementById('maxRoundsInTitle').textContent = maxRounds;
    
    if (currentRound > maxRounds && player1Submitted && player2Submitted) {
      setTimeout(() => {
        gameEnded = true;
        let resultText = '';
        
        if (userTotalScore < computerTotalScore) {
          resultText = `🏆 플레이어1 승리!<br>최종 점수: ${userTotalScore} vs ${computerTotalScore}`;
        } else if (computerTotalScore < userTotalScore) {
          resultText = `🏆 플레이어2 승리!<br>최종 점수: ${userTotalScore} vs ${computerTotalScore}`;
        } else {
          resultText = `🤝 무승부입니다!<br>최종 점수: ${userTotalScore} vs ${computerTotalScore}`;
        }
        
        document.getElementById('finalResult').innerHTML = resultText;
        document.getElementById('resultArea').classList.remove('hidden');
        document.getElementById('nextRoundArea').classList.add('hidden');
      }, 1000);
    }
  }
});

// 게임 시작
window.onload = () => startGame();
</script>
